
name: Build KENLEROS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q KENLEROS_Launcher_A72_v0.1.zip -d source

      - name: Fix Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/KENLEROS_Launcher_A72/app/src/main/java/com/kenleros/launcher/MainActivity.kt")
          s = p.read_text()

          annotation = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"
          if annotation not in s:
              s = annotation + "\n" + s

          imp = "import androidx.compose.ui.graphics.asImageBitmap"
          if imp not in s:
              package_end = s.find("\n", s.find("package "))
              s = s[:package_end + 1] + "\n" + imp + s[package_end + 1:]

          p.write_text(s)
          print("Kotlin source patched")

          print("========== SOURCE AROUND LINE 241 ==========")
          lines = s.splitlines()
          for i in range(max(0, 235), min(len(lines), 250)):
              print(f"{i+1}: {lines[i]}")
          PY

      - name: Fix Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/KENLEROS_Launcher_A72/app/build.gradle.kts")
          s = p.read_text()

          block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""

          pattern = r'compileOptions\s*\{[^}]*\}'
          if re.search(pattern, s):
              s = re.sub(pattern, block, s, count=1)
          else:
              s = s.replace("android {", "android {\n    " + block, 1)

          p.write_text(s)
          print("Java compatibility configured")
          PY

      - name: Build APK
        run: |
          cd source/KENLEROS_Launcher_A72
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENLEROS-A72
          path: source/KENLEROS_Launcher_A72/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        run: |
          test -f source/KENLEROS_Launcher_A72/app/build/outputs/apk/debug/app-debug.apk
          echo "KENLEROS APK successfully created"


name: Build KENLEROS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract fixed project
        run: |
          unzip -q KENLEROS_Launcher_A72_v0.1_FIXED.zip -d source

      - name: Fix Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/KENLEROS_Launcher_A72/app/build.gradle.kts")
          s = p.read_text()

          block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""

          pattern = r'compileOptions\s*\{[^}]*\}'

          if re.search(pattern, s):
              s = re.sub(pattern, lambda m: block, s, count=1)
          else:
              s = re.sub(
                  r'android\s*\{',
                  lambda m: m.group(0) + '\n    ' + block,
                  s,
                  count=1
              )

          p.write_text(s)
          print("Java compatibility configured correctly")
          print(s[:600])
          PY

      - name: Verify Kotlin source
        run: |
          FILE="source/KENLEROS_Launcher_A72/app/src/main/java/com/kenleros/launcher/MainActivity.kt"
          test -f "$FILE"
          if grep -q "asImageBitmap" "$FILE"; then
            echo "ERROR: Old asImageBitmap reference remains"
            exit 1
          fi
          echo "Kotlin source check passed"

      - name: Build APK
        run: |
          cd source/KENLEROS_Launcher_A72
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENLEROS-A72
          path: source/KENLEROS_Launcher_A72/app/build/outputs/apk/debug/app-debug.apk

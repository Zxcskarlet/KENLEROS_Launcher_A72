      - name: Fix Java target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/KENLEROS_Launcher_A72/app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions {" not in s:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""", 1)
          p.write_text(s)
          PY

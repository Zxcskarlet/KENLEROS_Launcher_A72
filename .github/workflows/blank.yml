
name: Build KENLEROS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q KENLEROS_Launcher_A72_v0.1.zip -d source

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/KENLEROS_Launcher_A72/app/build.gradle.kts")
          s = p.read_text()
          block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""
          pattern = r'compileOptions\s*\{[^}]*\}'
          if re.search(pattern, s):
              s = re.sub(pattern, block, s, count=1)
          else:
              s = s.replace("android {", "android {\n    " + block, 1)
          p.write_text(s)
          PY

      - name: Fix Kotlin import
        run: |
          FILE="source/KENLEROS_Launcher_A72/app/src/main/java/com/kenleros/launcher/MainActivity.kt"
          grep -q 'import androidx.compose.ui.graphics.asImageBitmap' "$FILE" || sed -i '1i import androidx.compose.ui.graphics.asImageBitmap' "$FILE"

      - name: Build APK
        run: |
          cd source/KENLEROS_Launcher_A72
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENLEROS-A72
          path: source/KENLEROS_Launcher_A72/app/build/outputs/apk/debug/app-debug.apk

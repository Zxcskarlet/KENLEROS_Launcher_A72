
name: Build KENLEROS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q KENLEROS_Launcher_A72_v0.1.zip -d source

      - name: Fix project configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source/KENLEROS_Launcher_A72")
          gradle_file = root / "app/build.gradle.kts"
          s = gradle_file.read_text()

          block = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""

          pattern = r'compileOptions\s*\{[^}]*\}'
          if re.search(pattern, s):
              s = re.sub(pattern, block, s, count=1)
          else:
              s = s.replace("android {", "android {\n    " + block, 1)

          gradle_file.write_text(s)

          kotlin_file = root / "app/src/main/java/com/kenleros/launcher/MainActivity.kt"
          lines = kotlin_file.read_text().splitlines()

          lines = [line for line in lines if "asImageBitmap" not in line]
          package_index = next(i for i, line in enumerate(lines) if line.startswith("package "))
          lines.insert(package_index + 1, "import androidx.compose.ui.graphics.asImageBitmap")

          if not any(line.startswith("@file:OptIn") for line in lines):
              lines.insert(0, "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)")

          kotlin_file.write_text("\n".join(lines) + "\n")
          PY

      - name: Build APK
        run: |
          cd source/KENLEROS_Launcher_A72
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENLEROS-A72
          path: source/KENLEROS_Launcher_A72/app/build/outputs/apk/debug/app-debug.apk
